name: CM 13.0 Build for Samsung rossa

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          df -h / /mnt
          # Preinstalled SDKs and toolchains we never use
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/share/vcpkg /usr/local/lib/node_modules \
            /usr/local/julia* /usr/share/swift /usr/share/miniconda /usr/lib/jvm \
            /opt/az /opt/microsoft /opt/google /opt/pipx /opt/mssql-tools \
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/local/bin/minikube \
            /usr/local/bin/kind /usr/local/bin/helm /usr/local/bin/pulumi* \
            /etc/skel/.rustup /home/runner/.rustup /home/runner/.cargo \
            "$AGENT_TOOLSDIRECTORY" || true
          # Big apt packages (browsers, databases, cloud CLIs, compilers we don't need)
          sudo apt-get remove -y --purge \
            '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' '^clang-.*' '^mongodb-.*' \
            '^mysql-.*' '^postgresql-.*' '^php.*' '^temurin-.*' '^openjdk-.*' \
            azure-cli google-cloud-cli google-chrome-stable firefox microsoft-edge-stable \
            powershell mono-devel libgl1-mesa-dri snapd 2>/dev/null || true
          sudo apt-get autoremove -y --purge || true
          sudo apt-get clean
          # Docker images we don't use (ubuntu:14.04 is pulled later)
          sudo docker system prune -af --volumes || true
          sudo journalctl --vacuum-size=10M || true
          # /mnt is a separate disk with much more free space, build there
          sudo mkdir -p /mnt/cm
          sudo chown -R $USER:$USER /mnt/cm
          df -h / /mnt

      - name: Install repo tool and git config (host)
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          git config --global user.email "ci@example.com"
          git config --global user.name "CM CI"
          git config --global color.ui false

      - name: Init CM 13.0
        run: |
          export PATH=~/.bin:$PATH
          cd /mnt/cm
          # skip macOS-host and MIPS prebuilts (several GB we never use)
          repo init --depth=1 -u https://github.com/CyanogenMod/android.git -b cm-13.0 \
            -g default,-darwin,-mips,-notdefault

      - name: Dump base manifest (before local manifest exists)
        run: |
          export PATH=~/.bin:$PATH
          cd /mnt/cm
          # no local_manifests yet, so this is the pure base manifest
          repo manifest > /tmp/base.xml
          grep -c "<project" /tmp/base.xml

      - name: Write local manifest
        run: |
          cd /mnt/cm
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/rossa.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
              <remote name="gh" fetch="https://github.com/"/>
              <!-- Device -->
              <project path="device/samsung/rossa" name="notnoelchannel2/android_device_samsung_rossa" remote="gh" revision="cm-13.0"/>
              <project path="kernel/samsung/rossa" name="notnoelchannel2/android_kernel_samsung_rossa-2" remote="gh" revision="selinux-xperms"/>
              <project path="vendor/samsung/rossa" name="notnoelchannel2/android_vendor_samsung_rossa" remote="gh" revision="cm-13.0"/>
              <project path="external/stlport" name="LineageOS/android_external_stlport" revision="cm-13.0" />
              <project path="external/mm-dash" name="CyanogenMod/android_external_mm-dash" revision="cm-13.0" />
              <project path="hardware/qcom/fm" name="CyanogenMod/android_hardware_qcom_fm" revision="cm-13.0" />
              <!-- Common -->
              <project path="hardware/samsung" name="LineageOS/android_hardware_samsung" remote="gh" revision="cm-13.0"/>
              <project path="device/samsung/qcom-common" name="LineageOS/android_device_samsung_qcom-common" remote="gh" revision="cm-13.0"/>
              <project path="device/qcom/common" name="LineageOS/android_device_qcom_common" remote="gh" revision="cm-13.0"/>
          </manifest>
          EOF

      - name: Remove base projects that clash with local manifest paths
        run: |
          cd /mnt/cm
          python3 - << 'EOF'
          import xml.etree.ElementTree as ET
          path = '.repo/local_manifests/rossa.xml'
          tree = ET.parse(path)
          local = tree.getroot()
          local_paths = {p.get('path') for p in local.findall('project')}
          base = ET.parse('/tmp/base.xml').getroot()
          removes = sorted({p.get('name') for p in base.findall('project')
                            if p.get('path') in local_paths})
          for n in removes:
              print('removing base project:', n)
          # remove-project entries go first, before the projects that replace them
          for i, n in enumerate(removes):
              local.insert(i, ET.Element('remove-project', {'name': n}))
          tree.write(path, encoding='utf-8', xml_declaration=True)
          EOF
          cat .repo/local_manifests/rossa.xml

      - name: Sync sources
        run: |
          export PATH=~/.bin:$PATH
          cd /mnt/cm
          repo sync -c --force-sync --optimized-fetch --no-tags --no-clone-bundle --prune -j8
          # chromium-webview is in the base manifest (shallow); only fetch it if sync left it empty
          if [ ! -e external/chromium-webview/Android.mk ]; then
            rm -rf external/chromium-webview
            git clone --depth 1 -b cm-13.0 https://github.com/CyanogenMod/android_external_chromium-webview external/chromium-webview
          fi
          df -h /mnt

      - name: Prepare sources
        run: |
          cd /mnt/cm
          # zygote: skip unsupported fds instead of aborting. The patch paths
          # start with frameworks/base/, so strip 3 components inside that repo.
          (cd frameworks/base && git apply -p3 ../../device/samsung/rossa/patches/frameworks_base/0001-zygote-skip-unsupported-fds.patch)
          # dtc: duplicate yylloc definition with newer host compilers
          sed -i "s/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/" kernel/samsung/rossa/scripts/dtc/dtc-lexer.lex.c_shipped

      - name: Prefetch downloaded prebuilts (Maven/HTTP)
        run: |
          cd /mnt/cm
          # vendor/cm fetches these during the build with Maven and curl inside the
          # 14.04 container, whose Java 7/Maven 3.0 can't talk to Maven Central any more.
          # The make rules only download when the output file is missing, so put
          # the files there with the host's curl first.
          amb=vendor/cm/ambientsdk/Android.mk
          if [ -f "$amb" ]; then
            v=$(sed -n 's/^LOCAL_MAVEN_VERSION *:= *//p' "$amb" | tr -d '[:space:]')
            d=out/target/common/obj/JAVA_LIBRARIES/ambientsdk_intermediates
            mkdir -p "$d"
            curl -fL --retry 5 -o "$d/com.cyngn.ambient.ambientsdk-$v.aar" \
              "https://repo1.maven.org/maven2/com/cyngn/ambient/ambientsdk/$v/ambientsdk-$v.aar"
            ls -l "$d"
          fi
          gel=vendor/cm/gello/Android.mk
          if [ -f "$gel" ]; then
            ver=$(sed -n 's/^LOCAL_HTTP_FILE_VERSION *:= *//p' "$gel" | tr -d '[:space:]')
            url=$(sed -n 's/^LOCAL_HTTP_PATH *:= *//p' "$gel" | tr -d '[:space:]')
            url=${url//\$(LOCAL_HTTP_FILE_VERSION)/$ver}
            d=out/target/common/obj/APPS/Gello_intermediates
            mkdir -p "$d"
            curl -fL --retry 5 -o "$d/gello.apk" "$url/gello.apk" \
              || echo "::warning::Gello download failed ($url); the build will try itself"
          fi

      - name: Start Ubuntu 14.04 build container
        run: |
          docker run -d --name cm_build --privileged \
            -v /mnt/cm:/cm \
            -w /cm \
            ubuntu:14.04 tail -f /dev/null

      - name: Install build dependencies (JDK 7)
        run: |
          docker exec cm_build bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            # fall back to old-releases if trusty has been moved off the main archive
            apt-get update || {
              sed -i "s|http://archive.ubuntu.com|http://old-releases.ubuntu.com|g; s|http://security.ubuntu.com|http://old-releases.ubuntu.com|g" /etc/apt/sources.list
              apt-get update
            }
            dpkg --add-architecture i386
            apt-get update || true
            apt-get install -y \
              bc bison build-essential curl flex g++-multilib gcc-multilib \
              git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-gplv2-dev \
              lib32z1-dev libesd0-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
              libssl-dev libwxgtk2.8-dev libxml2 libxml2-utils maven lzop openjdk-7-jdk \
              openjdk-7-jre pngcrush rsync schedtool squashfs-tools xsltproc zip \
              zlib1g-dev python python3 python-markdown unzip wget lzma
            apt-get clean
          '

      - name: Building CM 13.0
        run: |
          docker exec cm_build bash -c '
            set -e
            export JAVA_HOME=/usr/lib/jvm/java-7-openjdk-amd64
            export PATH=$JAVA_HOME/bin:$PATH
            export LC_ALL=C
            export ALLOW_MISSING_DEPENDENCIES=true
            export KBUILD_BUILD_USER=notnoelchannel
            export KBUILD_BUILD_HOST=notnoelchannel
            # Jack (Marshmallow Java compiler) runs out of heap with the default
            export ANDROID_JACK_VM_ARGS="-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx6g"
            cd /cm
            source build/envsetup.sh
            lunch cm_rossa-userdebug
            make -j$(nproc --all) otapackage
          '

      - name: Collect output
        if: success()
        run: |
          sudo chown -R $USER:$USER /mnt/cm/out/target/product/rossa
          mkdir -p out
          cp /mnt/cm/out/target/product/rossa/*.zip out/
          ls -lh out/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cm-13.0-rossa
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cm-13.0-rossa-${{ github.run_number }}
          name: CM 13.0 rossa (build ${{ github.run_number }})
          body: Unofficial CM 13.0 build for Samsung rossa.
          files: out/*
