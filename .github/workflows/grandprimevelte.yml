name: LineageOS CI (SM-G531F)

on:
  workflow_dispatch:
jobs:
  build:
    name: LineageOS Build CI
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - name: Check Out
      uses: actions/checkout@v7
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
    - name: Installing JDK 7 + Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository ppa:deadsnakes/ppa
        sudo add-apt-repository universe
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex axel g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb && sudo dpkg -i libtinfo5_6.3-2_amd64.deb && rm -f libtinfo5_6.3-2_amd64.deb
        wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb && sudo dpkg -i libncurses5_6.3-2_amd64.deb && rm -f libncurses5_6.3-2_amd64.deb
        cd /usr/local/src
        sudo wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
        sudo tar xvf Python-2.7.18.tgz
        cd Python-2.7.18
        sudo ./configure --enable-optimizations
        sudo make altinstall
        sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python2
        sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python
    - name: Install OpenJDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '8'
    - name: Syncing LineageOS sources
      run: |
        mkdir ~/TWRP
        cd ~/TWRP
        mkdir ~/.bin
        curl http://commondatastorage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        python3 ~/.bin/repo init --depth=1 -u https://github.com/LineageOS/android.git -b cm-14.1
        curl --create-dirs -L -o .repo/local_manifests/grandprimevelte.xml -O -L https://raw.githubusercontent.com/notnoelchannel2/j3xlte_manifest/refs/heads/main/grandprimevelte_cm-14.1.xml
        sudo git clone --depth 1 --branch android-5.1.1_r37 --single-branch https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.8 /opt/toolchains/aarch64-linux-android-4.8/
        git lfs install
        python3 ~/.bin/repo sync -c --force-sync --optimized-fetch --no-tags --no-clone-bundle --prune -j$(nproc --all)
    - name: Cleaning up even more
      run: |
        sudo du -sh /var/cache/apt/archives
        sudo apt-get autoclean
        sudo journalctl --rotate
        sudo journalctl --vacuum-size=100M
    - name: Building LineageOS
      run: |
        cd ~/TWRP/device/samsung/grandprimevelte/grandprimevelte_patchs/
        mv ~/TWRP/device/samsung/grandprimevelte/grandprimevelte_patchs/FMRadio_jni_fmr_Android.mk.patch ~/TWRP/packages/apps/FMRadio/jni/fmr
        cd ~/TWRP/packages/apps/FMRadio/jni/fmr
        patch -p5 < FMRadio_jni_fmr_Android.mk.patch
        mv ~/TWRP/device/samsung/grandprimevelte/grandprimevelte_patchs/GraphicBuffer.cpp.patch ~/TWRP/frameworks/native/libs/ui/GraphicBuffer.cpp.patch
        cd ~/TWRP/frameworks/native/libs/ui/
        patch -p4 < GraphicBuffer.cpp.patch
        mv ~/TWRP/device/samsung/grandprimevelte/grandprimevelte_patchs/GraphicBuffer.h.patch ~/TWRP/frameworks/native/include/ui/GraphicBuffer.h.patch
        cd ~/TWRP/frameworks/native/include/ui/
        patch -p4 < GraphicBuffer.h.patch
        mv ~/TWRP/device/samsung/grandprimevelte/grandprimevelte_patchs/com_android_internal_os_Zygote.cpp.patch ~/TWRP/frameworks/base/core/jni/com_android_internal_os_Zygote.cpp.patch
        cd ~/TWRP/frameworks/base/core/jni/
        patch -p4 < com_android_internal_os_Zygote.cpp.patch
        mv ~/TWRP/device/samsung/grandprimevelte/grandprimevelte_patchs/mkbootimg_Android.mk.patch ~/TWRP/system/core/mkbootimg/mkbootimg_Android.mk.patch
        cd ~/TWRP/system/core/mkbootimg/
        patch -p3 < mkbootimg_Android.mk.patch
    - name: Building LineageOS
      run: |
        OLDPATH=$PATH
        OLDJAVAHOME=$JAVA_HOME
        export PATH="$HOME/.jdk_7/java-se-7u75-ri/bin:$PATH"
        export JAVA_HOME="$HOME/.jdk_7/java-se-7u75-ri"
        git config --global user.email "you@example.com"
        git config --global user.name "Your Name"
        cd ~/TWRP
        git clone --depth 1 https://github.com/LiquidSmokeX64/android_prebuilts_gcc_linux-x86_arm_arm-eabi-4.8 ~/TWRP/prebuilt/linux-x86/toolchain/arm-eabi-4.4.3
        rm -rf ~/TWRP/device/samsung/grandprimevelte
        git clone https://github.com/notnoelchannel2/android_device_samsung_grandprimevelte -b lineage-14.1 ~/TWRP/device/samsung/grandprimevelte
        sed -i 's/--no-proxy/--noproxy/g' prebuilts/sdk/tools/jack-admin
        sed -i 's/--no-proxy/--noproxy/g' prebuilts/sdk/tools/jack
        rm -rf external/chromium-webview/
        git clone https://github.com/LineageOS/android_external_chromium-webview external/chromium-webview/
        rm -rf hardware/marvell/wlan
        git clone https://github.com/Nemirtingas/android_hardware_marvell_wlan -b lineage-14.1 hardware/marvell/wlan
        mkdir -p ~/TWRP/prebuilts/gcc/linux-x86/aarch64
        ln -sf /opt/toolchains/aarch64-linux-android-4.8 ~/TWRP/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-7.2-linaro
        find hardware/marvell/audio -name "Android.mk" -exec sed -i 's/include $(BUILD_SHARED_LIBRARY)/LOCAL_CFLAGS += -Wno-error -Wno-gnu-designator -Wno-unused-variable -Wno-unused-function\ninclude $(BUILD_SHARED_LIBRARY)/g' {} +
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export CROSS_COMPILE=/opt/toolchains/aarch64-linux-android-4.8/bin/aarch64-linux-android-
        lunch lineage_grandprimevelte-userdebug
        m org.cyanogenmod.platform -j$(nproc --all)
        make -j$(nproc --all) otapackage
        export PATH=$OLDPATH
        export JAVA_HOME=$OLDJAVAHOME
    - name: Uploading LineageOS builds
      uses: actions/upload-artifact@v7
      with:
        name: lineageos
        path: /home/runner/TWRP/out/target/product/grandprimevelte/*.zip
